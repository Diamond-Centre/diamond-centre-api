# Render Blueprint — Diamond Centre API
# Dashboard: https://dashboard.render.com/blueprints
# Uses existing Neon Postgres via DATABASE_URL (set in Dashboard).

services:
  - type: web
    name: dice-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: "0.0.0.0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REFRESH_TOKEN_SECRET
        sync: false
      - key: PAYMENT_CALLBACK_SECRET
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@dice.cm
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: DEFAULT_ADMIN_NAME
        value: Admin DiCe
      - key: ENABLE_SWAGGER
        value: "false"
